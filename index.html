<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Elite Glow Salon — Luxury Beauty & Care Experience in Chennai" />
    <title>Elite Glow Salon</title>
  </head>
  <body>
    <div id="root">
      <!-- On-time premium gold loading line. Removed automatically when React mounts. -->
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        background: linear-gradient(90deg, #C9A84C, #F5E68A, #C9A84C);
        box-shadow: 0 0 8px rgba(201, 168, 76, 0.6), 0 0 4px rgba(245, 230, 138, 0.4);
        z-index: 99999;
        animation: initial-gold-line 3s cubic-bezier(0.1, 0.8, 0.1, 1) forwards;
      "></div>
      <style>
        @keyframes initial-gold-line {
          0% { width: 0%; }
          100% { width: 92%; }
        }
        body {
          background-color: #0a0a0a;
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
